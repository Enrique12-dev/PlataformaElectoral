<!DOCTYPE html>

<html lang="es">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Respaldo de Actas Electorales
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">


</head>



<body>



<main class="main-content">



<header class="topbar">


<div>

<h2>
Respaldo de Actas Electorales
</h2>


<p>
Carga digital y almacenamiento de actas de escrutinio
</p>


</div>




<a href="../dashboard.html"
class="btn btn-primary">

<i class="bi bi-arrow-left"></i>

Volver

</a>



</header>









<!-- ==========================
     REGISTRO DE ACTA
========================== -->


<section class="panel mt-4">


<h5>

<i class="bi bi-file-earmark-image"></i>

Registrar Acta Electoral

</h5>





<form id="formActa">





<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

Número de Mesa

</label>



<input

type="text"

id="mesa"

class="form-control"

placeholder="Ejemplo: Mesa 015"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Local de Votación

</label>



<input

type="text"

id="local"

class="form-control"

placeholder="Ejemplo: Colegio San José"

required>


</div>



</div>









<div class="mb-3">


<label class="form-label">

Fotografía del Acta

</label>




<input

type="file"

id="imagenActa"

class="form-control"

accept="image/*"

capture="camera"

required>




<small class="text-muted">

Seleccione una fotografía del acta tomada desde el dispositivo móvil.

</small>



</div>









<button

type="submit"

class="btn btn-danger">


<i class="bi bi-cloud-upload"></i>


Guardar Acta


</button>







</form>





</section>









<!-- ==========================
     LISTADO DE ACTAS
========================== -->


<section class="panel mt-4">


<h5>

<i class="bi bi-folder2-open"></i>

Actas Registradas

</h5>






<div class="table-responsive">



<table class="table table-bordered">



<thead>


<tr>



<th>
Mesa
</th>




<th>
Local
</th>




<th>
Usuario
</th>




<th>
Rol
</th>




<th>
Fecha
</th>




<th>
Imagen
</th>




<th>
Acción
</th>



</tr>


</thead>








<tbody id="tablaActas">


</tbody>







</table>



</div>







</section>







</main>









<!-- ==========================
     JAVASCRIPT
========================== -->


<!-- Funciones generales -->

<script src="../js/utils.js"></script>




<!-- Gestión de almacenamiento -->

<script src="../js/storage.js"></script>





<!-- Seguridad y roles RNF-03 -->

<script src="../js/auth.js"></script>


<script>

protegerPagina("actas");

</script>






<!-- Gestión de actas RNF-04 -->

<script src="../js/modules/actas.js"></script>







</body>


</html>
