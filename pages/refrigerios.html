<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Control de Refrigerios
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet" href="../css/dashboard.css">


</head>


<body>


<main class="main-content">



<header class="topbar">


<div>

<h2>
Control Día D
</h2>


<p>
Entrega y seguimiento de refrigerios a personeros electorales
</p>


</div>



<a href="../dashboard.html" class="btn btn-primary">

<i class="bi bi-arrow-left"></i>

Volver

</a>


</header>





<section class="panel mt-4">


<h5>

<i class="bi bi-cup-hot-fill"></i>

Registrar Entrega

</h5>





<form id="formRefrigerio">



<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

Local Electoral

</label>



<select

id="localRefrigerio"

class="form-control"

required>


<option value="">

Seleccione local

</option>


</select>



</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Mesa de Votación

</label>



<select

id="mesaRefrigerio"

class="form-control"

required>


<option value="">

Seleccione mesa

</option>


</select>



</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Tipo de Entrega

</label>


<select

id="tipoRefrigerio"

class="form-control">


<option>
Desayuno
</option>


<option>
Almuerzo
</option>


<option>
Agua
</option>


<option>
Gaseosa
</option>


</select>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Estado

</label>


<select

id="estadoRefrigerio"

class="form-control">


<option>
Pendiente
</option>


<option>
Entregado
</option>


</select>


</div>




</div>





<button

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Registrar Entrega


</button>





</form>



</section>







<section class="panel mt-4">


<h5>

<i class="bi bi-clock-history"></i>

Seguimiento en Tiempo Real

</h5>






<div class="table-responsive">


<table class="table table-bordered">


<thead>

<tr>

<th>
Local
</th>


<th>
Mesa
</th>


<th>
Entrega
</th>


<th>
Estado
</th>


<th>
Fecha
</th>


</tr>


</thead>



<tbody id="tablaRefrigerios">


</tbody>



</table>


</div>



</section>





</main>





<script src="../js/utils.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/auth.js"></script>



<script>

protegerPagina("refrigerios");

</script>



<script src="../js/modules/refrigerios.js"></script>



</body>

</html>
