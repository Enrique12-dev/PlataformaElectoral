<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publicidad y Medios</title>

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<main class="main-content">

<header class="topbar">

<div>

<h2>
Publicidad y Medios
</h2>

<p>
Control de gastos publicitarios y seguimiento financiero
</p>

</div>

<a href="../dashboard.html" class="btn btn-primary">

<i class="bi bi-arrow-left"></i>

Volver

</a>

</header>

<section class="panel mt-4">

<h5>

<i class="bi bi-megaphone-fill"></i>

Registrar Gasto Publicitario

</h5>

<form id="formPublicidad">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Categoría del Gasto

</label>

<select 
class="form-control"
id="categoriaPublicidad">

<option>
Publicidad digital
</option>

<option>
Radio / TV
</option>

<option>
Paneles y banners
</option>

<option>
Volantes
</option>

<option>
Merchandising
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Proveedor / Empresa

</label>

<input

type="text"

class="form-control"

id="proveedorPublicidad"

required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Fecha del Gasto

</label>

<input

type="date"

class="form-control"

id="fechaPublicidad"

required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Monto Ejecutado

</label>

<input

type="number"

class="form-control"

id="montoPublicidad"

min="0"

required>

</div>

</div>

<button 
type="submit"
class="btn btn-danger">

<i class="bi bi-save"></i>

Registrar Gasto

</button>

</form>

</section>

<section class="panel mt-4">

<h5>

<i class="bi bi-bar-chart-fill"></i>

Resumen de Publicidad

</h5>

<div class="row mb-3">

<div class="col-md-4">

<h6>
Total Ejecutado
</h6>

<h4 id="totalPublicidad">

S/. 0.00

</h4>

</div>

<div class="col-md-4">

<h6>
Cantidad de Gastos
</h6>

<h4 id="cantidadPublicidad">

0

</h4>

</div>

<div class="col-md-4">

<h6>
Estado

</h6>

<h4>

Controlado

</h4>

</div>

</div>

<table class="table table-bordered">

<thead>

<tr>

<th>
Categoría
</th>

<th>
Proveedor
</th>

<th>
Fecha
</th>

<th>
Monto
</th>

<th>
Estado
</th>

</tr>

</thead>

<tbody id="tablaPublicidad">

</tbody>

</table>

</section>

</main>

<script src="../js/utils.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/modules/publicidad.js"></script>

</body>

</html>
