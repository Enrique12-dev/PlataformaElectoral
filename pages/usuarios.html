<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Gestión de Usuarios
</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<link rel="stylesheet" href="../css/dashboard.css">


</head>



<body>



<main class="main-content">



<header class="topbar">


<div>

<h2>
Gestión de Usuarios
</h2>


<p>
Administración de accesos y roles del sistema
</p>


</div>



<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>

Volver


</a>



</header>







<section class="panel mt-4">


<h5>

<i class="bi bi-person-gear"></i>

Registrar Usuario

</h5>





<form id="formUsuario">


<div class="row">





<div class="col-md-6 mb-3">

<label class="form-label">

Nombre completo

</label>


<input 
type="text"
id="nombreUsuario"
class="form-control"
required>


</div>






<div class="col-md-6 mb-3">

<label class="form-label">

Usuario

</label>


<input 
type="text"
id="usuario"
class="form-control"
required>


</div>







<div class="col-md-6 mb-3">

<label class="form-label">

Contraseña

</label>


<input 
type="password"
id="password"
class="form-control"
required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Rol

</label>



<select 
id="rolUsuario"
class="form-control">



<option value="Administrador">
Administrador
</option>


<option value="Candidato">
Candidato
</option>


<option value="Tesorero">
Tesorero
</option>


<option value="Personero General">
Personero General
</option>



</select>


</div>





</div>





<button 
type="submit"
class="btn btn-danger">


<i class="bi bi-save"></i>

Guardar Usuario


</button>



</form>



</section>









<section class="panel mt-4">


<h5>

<i class="bi bi-people-fill"></i>

Usuarios Registrados

</h5>





<div class="table-responsive">


<table class="table table-bordered">


<thead>


<tr>


<th>
Nombre
</th>


<th>
Usuario
</th>


<th>
Rol
</th>


<th>
Acciones
</th>



</tr>


</thead>



<tbody id="tablaUsuarios">


</tbody>



</table>



</div>



</section>






</main>






<script src="../js/utils.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/auth.js"></script>



<script>

protegerPagina("usuarios");

</script>



<script src="../js/modules/usuarios.js"></script>



</body>


</html>
