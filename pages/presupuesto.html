<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Presupuesto Electoral
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">


</head>



<body>



<main class="main-content">





<header class="topbar">


<div>


<h2>
Control de Presupuesto
</h2>


<p>
Seguimiento financiero de campaña
</p>


</div>




<a href="../dashboard.html" 
class="btn btn-primary">


<i class="bi bi-arrow-left"></i>

Volver


</a>



</header>









<!-- ==========================
     REGISTRO PRESUPUESTO
========================== -->


<section class="panel mt-4">


<h5>

<i class="bi bi-wallet2"></i>

Asignación Presupuestaria

</h5>





<form id="formPresupuesto">



<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

Presupuesto Total Asignado

</label>



<input

type="number"

class="form-control"

id="presupuestoTotal"

placeholder="Ejemplo: 50000"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Categoría

</label>



<select 

class="form-control"

id="categoriaPresupuesto">



<option>
Publicidad digital
</option>


<option>
Radio / TV
</option>


<option>
Impresiones
</option>


<option>
Merchandising
</option>


<option>
Logística
</option>



</select>



</div>






</div>







<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Guardar Presupuesto


</button>



</form>




</section>









<!-- ==========================
     ESTADO PRESUPUESTARIO
========================== -->


<section class="panel mt-4">



<h5>


<i class="bi bi-bar-chart-fill"></i>


Estado del Presupuesto


</h5>







<div class="progress">


<div

id="barraPresupuesto"

class="progress-bar bg-danger"

style="width:0%">


0% Ejecutado


</div>



</div>






<br>







<div class="row">






<div class="col-md-4">


<h6>

Presupuesto Total

</h6>


<h4 id="totalPresupuesto">

S/. 0.00

</h4>



</div>









<div class="col-md-4">


<h6>

Ejecutado

</h6>



<h4 id="presupuestoEjecutado">

S/. 0.00

</h4>



</div>








<div class="col-md-4">


<h6>

Disponible

</h6>



<h4 id="presupuestoDisponible">

S/. 0.00

</h4>



</div>






</div>






</section>







</main>










<!-- Funciones generales -->

<script src="../js/utils.js"></script>




<!-- Control de seguridad y roles -->

<script src="../js/auth.js"></script>





<!-- Almacenamiento -->

<script src="../js/storage.js"></script>





<!-- Módulo presupuesto -->

<script src="../js/modules/presupuesto.js"></script>






<script>


document.addEventListener(

"DOMContentLoaded",

()=>{


protegerPagina(
"presupuesto"
);


}

);



</script>





</body>


</html>
