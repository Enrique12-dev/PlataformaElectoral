<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Gestión de Personeros
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">



</head>





<body>





<main class="main-content">





<header class="topbar">



<div>


<h2>
Gestión de Personeros
</h2>


<p>
Administración de Personeros Generales y de Mesa
</p>


</div>





<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>




</header>









<!-- ==========================
     REGISTRO PERSONEROS
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-people"></i>

Asignación de Personero

</h5>







<form id="formPersonero">





<div class="row">








<div class="col-md-6 mb-3">


<label class="form-label">

Nombre completo

</label>



<input 

type="text"

class="form-control"

id="nombrePersonero"

placeholder="Ingrese nombres y apellidos"

required>



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

DNI

</label>



<input 

type="text"

class="form-control"

id="dniPersonero"

maxlength="8"

pattern="[0-9]{8}"

placeholder="Ingrese DNI"

required>



<small class="text-muted">

Debe contener 8 dígitos

</small>


</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Tipo de Personero

</label>




<select 

class="form-control"

id="tipoPersonero"

required>



<option value="Personero General">

Personero General (PG)

</option>



<option value="Personero de Mesa">

Personero de Mesa (PM)

</option>



</select>



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Local Electoral

</label>




<select 

class="form-control"

id="localPersonero"

required>



<option value="">

Seleccione local electoral

</option>



</select>



<small class="text-muted">

Instituciones públicas y privadas habilitadas

</small>


</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Número de Mesa

</label>




<select 

class="form-control"

id="mesaPersonero">



<option value="">

Seleccione mesa

</option>



</select>



<small class="text-muted">

Mesas disponibles desde 001 hasta 300

</small>


</div>






</div>









<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-person-plus"></i>


Registrar Personero


</button>







</form>







</section>









<!-- ==========================
     ESTRUCTURA ELECTORAL
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-diagram-3"></i>

Estructura Electoral

</h5>







<div class="table-responsive">



<table class="table table-bordered">



<thead>


<tr>


<th>
Nombre
</th>



<th>
DNI
</th>



<th>
Cargo
</th>



<th>
Local Electoral
</th>



<th>
Mesa
</th>



<th>
Estado
</th>



</tr>


</thead>








<tbody id="tablaPersoneros">



</tbody>







</table>



</div>








</section>







</main>

========================== -->

protegerPagina("personeros");


</script>

</body>

</html>
