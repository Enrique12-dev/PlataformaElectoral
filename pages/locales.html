<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Locales Electorales
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">


</head>





<body>





<main class="main-content">





<header class="topbar">



<div>


<h2>
Locales Electorales
</h2>


<p>
Registro de colegios y mesas de votación
</p>


</div>





<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>




</header>









<!-- ==========================
     REGISTRO DE LOCAL
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-building"></i>

Registrar Local de Votación

</h5>







<form id="formLocal">





<div class="row">






<div class="col-md-6 mb-3">


<label class="form-label">

Nombre del Local

</label>



<input 

type="text"

class="form-control"

id="nombreLocal"

placeholder="Ejemplo: Colegio Nacional"

required>



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Distrito

</label>



<input 

type="text"

class="form-control"

id="distrito"

required>



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Provincia

</label>



<input 

type="text"

class="form-control"

id="provincia"

required>



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Cantidad de Mesas

</label>



<input 

type="number"

class="form-control"

id="mesas"

min="1"

required>



</div>






</div>








<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-building"></i>


Registrar Local


</button>






</form>





</section>









<!-- ==========================
     LISTADO DE LOCALES
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-list-ul"></i>

Locales Registrados

</h5>







<div class="table-responsive">



<table class="table table-bordered">



<thead>



<tr>



<th>
Local
</th>



<th>
Distrito
</th>



<th>
Provincia
</th>



<th>
Mesas
</th>



</tr>



</thead>







<tbody id="tablaLocales">


</tbody>






</table>




</div>







</section>







</main>









<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="../js/utils.js"></script>

<script src="../js/storage.js"></script>




<!-- Seguridad RNF-03 -->

<script src="../js/auth.js"></script>



<script>

protegerPagina("locales");

</script>





<!-- Módulo de locales -->

<script src="../js/modules/locales.js"></script>






</body>

</html>
