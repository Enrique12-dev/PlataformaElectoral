<!DOCTYPE html>
<html lang="es">


<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Proyección Social
</title>



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<link rel="stylesheet" href="../css/dashboard.css">



</head>



<body>



<main class="main-content">



<header class="topbar">


<div>


<h2>
Proyección Social
</h2>


<p>
Registro de apoyo comunitario y control de gastos sociales
</p>


</div>




<a href="../dashboard.html" class="btn btn-primary">

<i class="bi bi-arrow-left"></i>

Volver

</a>



</header>








<section class="panel mt-4">


<h5>

<i class="bi bi-heart-fill"></i>

Registrar Apoyo Social

</h5>




<form id="formProyeccion">



<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

Beneficiario

</label>


<input

type="text"

id="beneficiario"

class="form-control"

placeholder="Nombre del beneficiario"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Fecha

</label>


<input

type="date"

id="fecha"

class="form-control"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Tipo de Apoyo

</label>



<select

id="tipoApoyo"

class="form-control"

required>


<option>
Canasta básica
</option>


<option>
Medicinas
</option>


<option>
Material deportivo
</option>


<option>
Mejoramiento de vivienda
</option>


</select>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Costo Asumido

</label>


<input

type="number"

id="costo"

class="form-control"

placeholder="S/. 0.00"

required>


</div>





</div>






<button

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Registrar Apoyo


</button>



</form>



</section>









<section class="panel mt-4">


<h5>

<i class="bi bi-list-ul"></i>

Historial de Apoyos

</h5>






<div class="table-responsive">



<table class="table table-bordered">



<thead>


<tr>


<th>
Beneficiario
</th>


<th>
Fecha
</th>


<th>
Tipo de Apoyo
</th>


<th>
Costo
</th>


<th>
Estado
</th>


</tr>


</thead>





<tbody id="tablaProyeccion">



</tbody>





</table>



</div>





</section>





</main>









<script src="../js/utils.js"></script>


<script src="../js/storage.js"></script>


<script src="../js/auth.js"></script>



<script>

protegerPagina("proyeccion");

</script>



<script src="../js/modules/proyeccion-social.js"></script>





</body>


</html>
