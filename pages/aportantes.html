<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Gestión de Aportantes
</title>


<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">


</head>



<body>


<main class="main-content">



<header class="topbar">


<div>


<h2>
Gestión de Aportantes
</h2>


<p>
Registro y control financiero de aportes
</p>


</div>




<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>



</header>









<!-- ==========================
     REGISTRO DE APORTANTE
========================== -->


<section class="panel mt-4">


<h5>

<i class="bi bi-person-plus"></i>

Registrar Nuevo Aportante

</h5>





<form id="formAportante">





<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

DNI / RUC

</label>


<input 

type="text"

class="form-control"

id="dni"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Nombre Completo

</label>


<input 

type="text"

class="form-control"

id="nombre"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Celular

</label>


<input 

type="text"

class="form-control"

id="celular">


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Tipo de Aporte

</label>



<select 

class="form-control"

id="tipoAporte">



<option>
Efectivo
</option>



<option>
Especie
</option>



<option>
Préstamo de local
</option>



</select>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Valor Estimado

</label>



<input 

type="number"

class="form-control"

id="valor"

required>


</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Comprobante / Recibo

</label>



<input 

type="text"

class="form-control"

id="comprobante">


</div>






</div>






<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Registrar Aporte


</button>




</form>



</section>









<!-- ==========================
     LISTADO DE APORTANTES
========================== -->


<section class="panel mt-4">



<h5>

<i class="bi bi-people"></i>

Listado de Aportantes

</h5>





<div class="table-responsive">


<table class="table table-bordered">


<thead>


<tr>


<th>
DNI/RUC
</th>


<th>
Nombre
</th>


<th>
Tipo
</th>


<th>
Valor
</th>


<th>
Estado
</th>


</tr>


</thead>





<tbody id="tablaAportantes">


</tbody>




</table>


</div>



</section>







</main>










<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="../js/utils.js"></script>



<!-- Almacenamiento -->

<script src="../js/storage.js"></script>




<!-- Seguridad RNF-03 -->

<script src="../js/auth.js"></script>


<script>

protegerPagina("aportantes");

</script>





<!-- Módulo de aportantes -->

<script src="../js/modules/aportantes.js"></script>




</body>

</html>
