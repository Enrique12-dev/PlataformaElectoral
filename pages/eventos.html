<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Eventos de Campaña
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">



</head>





<body>





<main class="main-content">





<header class="topbar">



<div>


<h2>
Eventos de Campaña
</h2>



<p>
Control de actividades y recaudación
</p>



</div>





<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>




</header>









<!-- ==========================
     REGISTRO DE EVENTOS
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-calendar-event"></i>

Registrar Evento

</h5>






<form id="formEvento">





<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

Nombre del evento

</label>



<input 

type="text"

class="form-control"

id="nombreEvento"

required>



</div>








<div class="col-md-6 mb-3">


<label class="form-label">

Tipo de evento

</label>



<select 

class="form-control"

id="tipoEvento">



<option>
Mítin
</option>



<option>
Actividad deportiva
</option>



<option>
Cena pro fondos
</option>



<option>
Baile
</option>



</select>



</div>








<div class="col-md-4 mb-3">


<label class="form-label">

Costo Organización

</label>



<input 

type="number"

class="form-control"

id="costoEvento"

required>



</div>








<div class="col-md-4 mb-3">


<label class="form-label">

Entradas Vendidas

</label>



<input 

type="number"

class="form-control"

id="entradasEvento"

required>



</div>








<div class="col-md-4 mb-3">


<label class="form-label">

Recaudación Bruta

</label>



<input 

type="number"

class="form-control"

id="recaudacionEvento"

required>



</div>






</div>







<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Registrar Evento


</button>





</form>





</section>









<!-- ==========================
     LISTADO DE EVENTOS
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-list-check"></i>

Eventos Registrados

</h5>





<div class="table-responsive">



<table class="table table-bordered">



<thead>


<tr>


<th>
Evento
</th>



<th>
Tipo
</th>



<th>
Costo
</th>



<th>
Recaudación
</th>



<th>
Ganancia
</th>



</tr>


</thead>





<tbody id="tablaEventos">



</tbody>




</table>



</div>




</section>







</main>









<!-- ==========================
     JAVASCRIPT
========================== -->



<!-- Funciones generales -->

<script src="../js/utils.js"></script>




<!-- Almacenamiento -->

<script src="../js/storage.js"></script>




<!-- Seguridad RNF-03 -->

<script src="../js/auth.js"></script>



<script>

protegerPagina("eventos");

</script>





<!-- Módulo de eventos -->

<script src="../js/modules/eventos.js"></script>







</body>

</html>
