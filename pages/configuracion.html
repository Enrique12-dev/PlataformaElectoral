<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Configuración
</title>



<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">



</head>





<body>





<main class="main-content">





<header class="topbar">



<div>


<h2>
Configuración del Sistema
</h2>


<p>
Administración general de la plataforma
</p>


</div>





<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>





</header>









<!-- ==========================
     PERFIL DEL USUARIO
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-person-circle"></i>

Perfil del Usuario

</h5>





<form>



<div class="mb-3">


<label class="form-label">

Nombre del usuario

</label>



<input 

type="text"

class="form-control"

id="nombreUsuario"

value="Administrador">



</div>







<div class="mb-3">


<label class="form-label">

Correo electrónico

</label>



<input 

type="email"

class="form-control"

id="correoUsuario">



</div>






<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Guardar Cambios


</button>




</form>



</section>









<!-- ==========================
     PREFERENCIAS
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-gear"></i>

Preferencias del Sistema

</h5>







<div class="form-check">


<input 

class="form-check-input"

type="checkbox"

id="modoOffline"

checked>




<label 

class="form-check-label"

for="modoOffline">


Activar modo offline


</label>



</div>







<div class="form-check mt-3">



<input 

class="form-check-input"

type="checkbox"

id="alertasFinancieras">





<label 

class="form-check-label"

for="alertasFinancieras">


Recibir alertas financieras


</label>



</div>





</section>







</main>

protegerPagina("configuracion");

</script>





</body>

</html>
