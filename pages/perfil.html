<!DOCTYPE html>
<html lang="es">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Perfil de Usuario
</title>




<!-- Bootstrap -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">




<!-- Iconos -->

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">




<!-- CSS Sistema -->

<link rel="stylesheet" href="../css/dashboard.css">



</head>






<body>





<main class="main-content">





<header class="topbar">



<div>


<h2>
Mi Perfil
</h2>



<p>
Información del usuario autenticado
</p>



</div>





<a href="../dashboard.html" class="btn btn-primary">


<i class="bi bi-arrow-left"></i>


Volver


</a>




</header>









<!-- ==========================
     DATOS DEL USUARIO
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-person-circle"></i>

Datos Personales

</h5>








<form id="formPerfil">





<div class="row">





<div class="col-md-6 mb-3">


<label class="form-label">

Nombre Completo

</label>



<input 

type="text"

class="form-control"

id="nombreUsuario"

value="">



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Documento de Identidad

</label>



<input 

type="text"

class="form-control"

id="dniUsuario">



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Celular

</label>



<input 

type="text"

class="form-control"

id="celularUsuario">



</div>









<div class="col-md-6 mb-3">


<label class="form-label">

Correo Electrónico

</label>



<input 

type="email"

class="form-control"

id="correoUsuario">



</div>







<div class="col-md-6 mb-3">


<label class="form-label">

Rol del Sistema

</label>



<input 

type="text"

class="form-control"

id="rolUsuario"

readonly>



</div>






</div>








<button 

type="submit"

class="btn btn-danger">


<i class="bi bi-save"></i>


Guardar cambios


</button>





</form>





</section>









<!-- ==========================
     SEGURIDAD
========================== -->



<section class="panel mt-4">



<h5>

<i class="bi bi-shield-lock"></i>

Seguridad

</h5>







<div class="mb-3">


<label class="form-label">

Nueva contraseña

</label>



<input 

type="password"

class="form-control"

id="nuevaPassword">



</div>







<button 

class="btn btn-primary">


<i class="bi bi-key"></i>


Actualizar contraseña


</button>





</section>








</main>









<!-- ==========================
     JAVASCRIPT
========================== -->



<script src="../js/utils.js"></script>


<script src="../js/storage.js"></script>


<script src="../js/auth.js"></script>





<script>


/*
    RNF-03
    Validar sesión activa
*/


const usuario =
obtenerUsuarioActivo();



if(!usuario){


    alert(
        "Debe iniciar sesión."
    );


    window.location.href =
    "../index.html";


}





/*
    Mostrar información
*/


if(usuario){


document.getElementById(
"nombreUsuario"
).value =
usuario.nombre || "";



document.getElementById(
"dniUsuario"
).value =
usuario.dni || "";



document.getElementById(
"celularUsuario"
).value =
usuario.celular || "";



document.getElementById(
"correoUsuario"
).value =
usuario.correo || "";



document.getElementById(
"rolUsuario"
).value =
usuario.rol || "";



}



</script>






</body>

</html>
